<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% if page.description or page.summary %}
  <meta name="description" content="{{ page.description | default: page.summary | escape }}">
  {% else %}
  <meta name="description" content="{{ site.description | escape }}">
  {% endif %}
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ site.brand.logo }}">
</head>
<body>
  <div class="site-shell">
    {% include header.html %}

    <div class="layout{% if page.show_sidebar != false %} has-sidebar{% endif %}">
      {% if page.show_sidebar != false %}
        {% include sidebar.html %}
      {% endif %}

      <main class="content" id="main">
        {{ content }}
      </main>
    </div>

    {% include footer.html %}
  </div>
  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
</body>
</html>
